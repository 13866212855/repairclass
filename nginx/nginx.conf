# =========================================================================
# repairclass - Single-Domain Multi-Service Gateway (dynamic tenants)
# Entrance: host 7859 -> nginx:80
#   /                      -> repairclass:3000  (main Node/Express app)
#   /<subpath>/ (from DB)  -> tenant upstreams, rendered by the main app
#                             and hot-reloaded by gateway_sync.sh every 10s
# Tenant routing is NOT hardcoded here: base config only declares the
# main app and includes the dynamic block file. Manage sub-tenants from
# the /admin panel ("Sub-Tenant Management" tab).
# =========================================================================

server {
    listen 80;
    server_name _;

    # Main app uploads images via multer/Cloudinary: raise body limit
    client_max_body_size 50m;

    # ----------------------------------------------------------------
    # Dynamic tenant routes (rendered by repairclass /api/gateway/render,
    # atomically swapped in by /usr/local/bin/gateway_sync.sh)
    # ----------------------------------------------------------------
    include /etc/nginx/conf.d/tenants/*.conf;

    # ----------------------------------------------------------------
    # Main application: Node/Express (SPA + /api/*) - the catch-all
    # location MUST stay last so tenant prefixes win
    # ----------------------------------------------------------------
    location / {
        proxy_pass http://repairclass:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
