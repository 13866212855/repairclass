<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    
    <!-- DNS prefetch & preconnect for external assets -->
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <title>耿中班班通报修管理系统</title>
    <meta name="description" content="耿棚初级中学班班通智慧报修管理系统，基于现代化极速 React + Vite 架构，支持教师一键报修、设备位置记忆、故障智能记忆与运维看板。" />
    <meta property="og:title" content="耿中班班通报修管理系统" />
    <meta property="og:description" content="耿棚初级中学班班通智慧报修管理系统，支持移动端秒级打开、即时报修与运维处理看板。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for instant WeChat caching & offline resiliency
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
