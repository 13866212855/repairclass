    <title>耿中班班通报修管理系统</title>

    <meta property="og:title" content="耿中班班通报修管理系统" />
    <meta property="og:description" content="耿棚初级中学班班通智慧报修管理系统，支持移动端秒级打开、即时报修与运维处理看板。" />

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Clean up any stale service workers or caches to ensure fresh code loads in preview
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.unregister();
          }
        }).catch(function() {});
      }
      if (window.caches) {
        caches.keys().then(function(names) {
          for (var name of names) {
            caches.delete(name);
          }
        }).catch(function() {});
      }
    </script>
  </body>
